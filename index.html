<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa rozvozu ovoce</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --gruen: #4a7729; --dunkel: #2f4a1a; --hell: #f4f7ef;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: "Segoe UI", Arial, sans-serif; }
  #app { display: flex; height: 100%; }
  #sidebar {
    width: 350px; min-width: 350px; background: var(--hell); border-right: 1px solid #d5ddc8;
    display: flex; flex-direction: column; overflow-y: auto;
  }
  #kopf { background: var(--gruen); color: #fff; padding: 14px 16px; position: relative; }
  #kopf h1 { margin: 0 0 4px; font-size: 19px; padding-right: 90px; }
  #sprachen { position: absolute; top: 12px; right: 12px; display: flex; gap: 2px; }
  #sprachen button {
    padding: 3px 8px; font-size: 12px; font-weight: 700; border: 1px solid rgba(255,255,255,.6);
    background: transparent; color: #fff; cursor: pointer; border-radius: 4px;
  }
  #sprachen button.aktiv { background: #fff; color: var(--dunkel); }
  #kopf .status { font-size: 12px; opacity: .9; }
  #map { flex: 1; }
  .block { padding: 12px 16px; border-bottom: 1px solid #e0e6d5; }
  .block h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--dunkel); }
  button.gross {
    width: 100%; padding: 10px; font-size: 15px; border: 0; border-radius: 6px;
    background: var(--gruen); color: #fff; cursor: pointer; font-weight: 600;
  }
  button.gross:hover { background: var(--dunkel); }
  button.klein {
    padding: 4px 10px; font-size: 12px; border: 1px solid #b9c5a5; border-radius: 5px;
    background: #fff; cursor: pointer; color: #333;
  }
  button.klein.aktiv { background: var(--gruen); color: #fff; border-color: var(--gruen); }
  .zeile { display: flex; gap: 6px; flex-wrap: wrap; }
  label.obst {
    display: flex; align-items: center; gap: 6px; font-size: 14px; padding: 3px 0; cursor: pointer;
  }
  .punkt { width: 13px; height: 13px; border-radius: 50%; display: inline-block; flex: none; }
  table.summen { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.summen td { padding: 3px 0; }
  table.summen td.z { text-align: right; font-weight: 600; white-space: nowrap; padding-left: 8px; }
  #stopps { font-size: 13px; }
  .stopp { padding: 7px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
  .stopp:hover { background: #e8eedb; border-color: #cdd8b8; }
  .stopp b { display: block; }
  .stopp .grau { color: #666; }
  .stopp .notiz { display: block; color: #8a6d1f; font-style: italic; font-size: 12px; margin-top: 2px; }
  .stopp .notiz.warn { color: #b3261e; font-weight: 600; font-style: normal; }
  a.nav { color: #2b6cb0; text-decoration: none; font-weight: 600; font-size: 12px; white-space: nowrap; }
  a.nav:hover { text-decoration: underline; }
  .stopp a.tel, .popup-lief a.tel { color: #2b6cb0; text-decoration: none; }
  #suche {
    width: 100%; padding: 6px 9px; font-size: 13px; border: 1px solid #b9c5a5; border-radius: 6px;
    margin-bottom: 8px; background: #fff;
  }
  #kartenToggle {
    display: none; position: fixed; right: 12px; bottom: 12px; z-index: 1300;
    padding: 9px 14px; font-size: 14px; font-weight: 600; border: 0; border-radius: 22px;
    background: var(--gruen); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3); cursor: pointer;
  }
  .stopp.erledigt { background: #e6f4ea; border-color: #b7dfc0; }
  .stopp.erledigt:hover { background: #d8eedf; }
  .stopp.mit-cb { display: flex; gap: 8px; align-items: flex-start; }
  .stopp.mit-cb input { width: 17px; height: 17px; flex: none; margin: 2px 0 0; cursor: pointer; accent-color: var(--gruen); }
  .stopp-inhalt { flex: 1; }
  .stopp.im-plan { background: #e7effa; border-color: #b9cdea; }
  .stopp.im-plan:hover { background: #dbe7f7; }
  .plan-obst { margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
  .plan-obst label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; }
  .stopp .plan-obst input { width: 15px; height: 15px; accent-color: var(--gruen); margin: 0; flex: none; }
  .plan-nr {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%; background: #2b6cb0; color: #fff;
    font-size: 12px; font-weight: 700; flex: none;
  }
  .plan-ctrl { display: flex; flex-direction: column; gap: 4px; align-items: center; flex: none; }
  .plan-griff {
    cursor: grab; touch-action: none; user-select: none; color: #7d8a6a;
    font-size: 17px; line-height: 1; padding: 2px 4px;
  }
  .plan-griff:active { cursor: grabbing; }
  .stopp.dragging { opacity: .65; border: 1px dashed #2b6cb0; background: #dbe7f7; }
  #fehler { color: #a33; font-size: 12.5px; line-height: 1.5; }
  #ladehinweis {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1200;
    background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 8px 16px;
    font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.15); display: none;
  }
  .marker-label { background: transparent; border: 0; }
  .marker-kreis {
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; color: #fff; font-weight: 700; font-size: 11px;
    border: 2.5px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.4);
    white-space: nowrap; position: relative;
  }
  .marker-sorten {
    display: flex; flex-direction: column; align-items: center;
    font-size: 10px; line-height: 1.2; text-shadow: 0 1px 2px rgba(0,0,0,.55);
  }
  .marker-nr {
    position: absolute; top: -8px; left: -8px; width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    background: #2b6cb0; color: #fff; border: 2px solid #fff; border-radius: 50%;
    font-size: 11px; font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .pause-marke {
    background: #e8930c; color: #fff; border: 2px solid #fff; border-radius: 12px;
    padding: 2px 7px; font-size: 11px; font-weight: 700; white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,.35); width: max-content;
  }
  .marker-kreis.erledigt { opacity: .92; }
  .popup-lief { font-size: 13px; }
  .popup-lief h3 { margin: 0 0 6px; font-size: 15px; }
  .popup-lief table { border-collapse: collapse; }
  .popup-lief td { padding: 2px 8px 2px 0; vertical-align: top; }
  .popup-lief .sum { border-top: 1px solid #ccc; font-weight: 700; }
  .haken { color: #2e7d32; font-weight: 700; }
  .offen-punkt { color: #c62828; font-weight: 700; }
  input[type=date] { font-size: 13px; padding: 3px; border: 1px solid #b9c5a5; border-radius: 4px; }
  @media (max-width: 700px) {
    #app { flex-direction: column; }
    #sidebar { width: 100%; min-width: 0; max-height: 50%; }
    #kartenToggle { display: block; }
    body.nur-karte #sidebar { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="kopf">
      <h1>🍒 <span data-t="titel">Mapa rozvozu ovoce</span></h1>
      <div class="status" id="status">Načítám data …</div>
      <div id="sprachen"><button data-l="cs">CZ</button><button data-l="de">DE</button></div>
    </div>


    <div class="block" id="statusBlock" style="display:none">
      <h2 data-t="stavRozvozu">Stav rozvozu</h2>
      <div class="zeile" id="statusKnoepfe">
        <button class="klein aktiv" data-s="offen" data-t="offen">🔴 Ještě rozvézt</button>
        <button class="klein" data-s="geliefert" data-t="geliefert">✓ Doručeno</button>
        <button class="klein" data-s="alle" data-t="alle">Vše</button>
        <button class="klein" data-s="plan" data-t="plan">🗺️ Plánovač</button>
      </div>
    </div>

    <div class="block" id="zeitBlock" style="display:none">
      <h2 data-t="obdobi">Období</h2>
      <div class="zeile" id="zeitKnoepfe">
        <button class="klein aktiv" data-z="alle" data-t="alle">Vše</button>
        <button class="klein" data-z="heute" data-t="heute">Dnes</button>
        <button class="klein" data-z="7tage" data-t="tage7">Příštích 7 dní</button>
      </div>
      <div class="zeile" style="margin-top:8px;align-items:center">
        <input type="date" id="von"> <span style="font-size:12px" data-t="bis">do</span> <input type="date" id="bis">
      </div>
    </div>

    <div class="block" id="obstBlock" style="display:none">
      <h2 data-t="druhy">Druhy ovoce</h2>
      <div id="obstFilter"></div>
    </div>

    <div class="block">
      <h2 id="summenTitel">Součty (výběr)</h2>
      <table class="summen" id="summen"></table>
      <div id="routeInfo" style="font-size:13px;margin-top:6px"></div>
    </div>

    <div class="block">
      <h2 data-t="zastavky">Zastávky</h2>
      <input type="search" id="suche" data-t-ph="suche" placeholder="🔍 hledat jméno, adresu, poznámku …" autocomplete="off">
      <div id="stopps">–</div>
    </div>

    <div class="block" id="fehlerBlock" style="display:none">
      <h2 data-t="adresaNenalezena">⚠️ Adresa nenalezena</h2>
      <div id="fehler"></div>
    </div>
  </div>
  <div id="map"></div>
</div>
<div id="ladehinweis" data-t="laden">Hledám adresy na mapě …</div>
<button id="kartenToggle">🗺️ Jen mapa</button>

<script>
"use strict";
// ------------------------------------------------------------------
// Jazyky rozhraní: cs / de. t(klíč, …args) vrátí text v aktuálním jazyce,
// statické prvky mají data-t (text) nebo data-t-ph (placeholder).
// ------------------------------------------------------------------
const TEXTE = {
  cs: {
    titel: "Mapa rozvozu ovoce",
    statusLeer: "Načítám data …",
    stavRozvozu: "Stav rozvozu", offen: "🔴 Ještě rozvézt", geliefert: "✓ Doručeno", alle: "Vše", plan: "🗺️ Plánovač",
    obdobi: "Období", heute: "Dnes", tage7: "Příštích 7 dní", bis: "do",
    druhy: "Druhy ovoce", summenAuswahl: "Součty (výběr)", summenPlan: "Součty (plán)",
    zastavky: "Zastávky", suche: "🔍 hledat jméno, adresu, poznámku …", adresaNenalezena: "⚠️ Adresa nenalezena",
    laden: "Hledám adresy na mapě …", ladenN: (i, n) => `Hledám adresy na mapě … (${i}/${n})`,
    nurKarte: "🗺️ Jen mapa", liste: "☰ Seznam",
    webGeladen: d => `🌐 Data načtena z webu${d ? " · nahráno: " + d : ""}`,
    trasa: "🚗 Trasa:", pauza: n => ` + ${n}× pauza 45 min`,
    odjezdKonec: (ab, ende) => ` · odjezd ${ab}, konec ~<b>${ende}</b>`,
    routeZusatz: (zurueck, frei, min) => ` · z Krtel${zurueck ? " a zpět" : ""}${frei ? ", přes Freistadt" : ""}, vykládka ${min} min/zastávka`,
    dojezd: (km, dauer) => `⤷ dojezd ${km} · ${dauer}`, prijezd: "příjezd", doma: "doma",
    berechne: "Počítám trasu …", routeFehler: "Trasu se nepodařilo spočítat (routovací server je nedostupný).",
    startFehler: "Výchozí bod (Krtely) se nepodařilo najít.", sucheReihenfolge: "Hledám nejkratší pořadí …",
    reihenfolgeFehler: "Nejkratší pořadí se nepodařilo spočítat.", startPopup: "Start: Krtely 70",
    pausePopup: d => `Po ${d} čisté jízdy – povinná přestávka 45 min`,
    celkem: "Celkem", stopps: n => n === 1 ? "1 zastávka" : (n >= 2 && n <= 4 ? n + " zastávky" : n + " zastávek"),
    nichts: "Ve výběru nic není.", naplanovano: "Naplánováno:", zrusit: "zrušit výběr", nejkratsi: "🔀 nejkratší pořadí",
    navrat: "s návratem do Krtel", freistadt: "přes Freistadt (S10), ne Bad Leonfelden", odjezd: "🕖 Odjezd z Krtel",
    planHinweis: "Zaškrtněte u zastávek druhy ovoce, které chcete vzít na cestu – mapa, součty a trasa ukážou jen ty. Pořadí pak změníte přetažením karty za ⠿, u každé zastávky uvidíte odhad příjezdu.",
    mengeUnbekannt: "množství zatím neznámé", waze: "🧭 Waze", popupWaze: "🧭 Navigovat ve Waze",
    versteckt: n => `… ${n} ${n === 1 ? "zastávka neodpovídá" : (n <= 4 ? "zastávky neodpovídají" : "zastávek neodpovídá")} hledání`,
    heim: "🏠 Zpět do Krtel", griffTitel: "táhnutím změníte pořadí",
    fehlerZeile: (n, a) => `• ${n}: „${a}" – zkontrolujte prosím zápis v Excelu`, obst: "Ovoce",
  },
  de: {
    titel: "Obst-Lieferkarte",
    statusLeer: "Daten werden geladen …",
    stavRozvozu: "Lieferstatus", offen: "🔴 Noch zu liefern", geliefert: "✓ Geliefert", alle: "Alle", plan: "🗺️ Planer",
    obdobi: "Zeitraum", heute: "Heute", tage7: "Nächste 7 Tage", bis: "bis",
    druhy: "Obstsorten", summenAuswahl: "Summen (Auswahl)", summenPlan: "Summen (Plan)",
    zastavky: "Stopps", suche: "🔍 Name, Adresse, Notiz suchen …", adresaNenalezena: "⚠️ Adresse nicht gefunden",
    laden: "Suche Adressen auf der Karte …", ladenN: (i, n) => `Suche Adressen auf der Karte … (${i}/${n})`,
    nurKarte: "🗺️ Nur Karte", liste: "☰ Liste",
    webGeladen: d => `🌐 Daten vom Web geladen${d ? " · hochgeladen: " + d : ""}`,
    trasa: "🚗 Route:", pauza: n => ` + ${n}× Pause 45 min`,
    odjezdKonec: (ab, ende) => ` · Abfahrt ${ab}, Ende ~<b>${ende}</b>`,
    routeZusatz: (zurueck, frei, min) => ` · ab Krtely${zurueck ? " und zurück" : ""}${frei ? ", über Freistadt" : ""}, Entladen ${min} min/Stopp`,
    dojezd: (km, dauer) => `⤷ Anfahrt ${km} · ${dauer}`, prijezd: "Ankunft", doma: "zu Hause",
    berechne: "Route wird berechnet …", routeFehler: "Route konnte nicht berechnet werden (Routing-Server nicht erreichbar).",
    startFehler: "Startpunkt (Krtely) wurde nicht gefunden.", sucheReihenfolge: "Suche kürzeste Reihenfolge …",
    reihenfolgeFehler: "Kürzeste Reihenfolge konnte nicht berechnet werden.", startPopup: "Start: Krtely 70",
    pausePopup: d => `Nach ${d} reiner Fahrzeit – Pflichtpause 45 min`,
    celkem: "Gesamt", stopps: n => n === 1 ? "1 Stopp" : n + " Stopps",
    nichts: "Nichts in der Auswahl.", naplanovano: "Geplant:", zrusit: "Auswahl löschen", nejkratsi: "🔀 kürzeste Reihenfolge",
    navrat: "mit Rückfahrt nach Krtely", freistadt: "über Freistadt (S10), nicht Bad Leonfelden", odjezd: "🕖 Abfahrt in Krtely",
    planHinweis: "Bei den Stopps die Obstsorten anhaken, die auf die Tour mitkommen – Karte, Summen und Route zeigen nur diese. Die Reihenfolge ändert man durch Ziehen der Karte am ⠿, bei jedem Stopp erscheint die geschätzte Ankunft.",
    mengeUnbekannt: "Menge noch unbekannt", waze: "🧭 Waze", popupWaze: "🧭 Mit Waze navigieren",
    versteckt: n => `… ${n} Stopp${n === 1 ? " passt" : "s passen"} nicht zur Suche`,
    heim: "🏠 Zurück nach Krtely", griffTitel: "Ziehen ändert die Reihenfolge",
    fehlerZeile: (n, a) => `• ${n}: „${a}" – bitte Eintrag in Excel prüfen`, obst: "Obst",
  },
};
// názvy ovoce z Excelu (německy) pro českou verzi
const OBST_CS = { "Weichsel": "Višně", "Zwetschken": "Švestky", "Birnen Williams": "Hrušky Williams", "Äpfel": "Jablka",
  "Zwetschke": "Švestky", "Birnen": "Hrušky", "Apfel": "Jablka", "Kirschen": "Třešně", "Marillen": "Meruňky" };
let sprache = localStorage.getItem("sprache") || (/^de/i.test(navigator.language || "") ? "de" : "cs");
function t(k, ...args) { const v = TEXTE[sprache][k] ?? TEXTE.cs[k] ?? k; return typeof v === "function" ? v(...args) : v; }
function LOC() { return sprache === "cs" ? "cs-CZ" : "de-AT"; }
function obstName(o) { return sprache === "cs" ? (OBST_CS[o] || o) : o; }
let letzterStatus = null; // [klíč, ...args] – aby šel stav přeložit při přepnutí jazyka
function statischeTexte() {
  document.documentElement.lang = sprache;
  document.title = t("titel");
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-t-ph]").forEach(el => { el.placeholder = t(el.dataset.tPh); });
  document.querySelectorAll("#sprachen button").forEach(b => b.classList.toggle("aktiv", b.dataset.l === sprache));
  if (letzterStatus) document.getElementById("status").textContent = t(...letzterStatus);
  const kt = document.getElementById("kartenToggle");
  kt.textContent = document.body.classList.contains("nur-karte") ? t("liste") : t("nurKarte");
}
function spracheSetzen(l) {
  sprache = l;
  localStorage.setItem("sprache", l);
  statischeTexte();
  if (alleZeilen.length) datenUebernehmen(alleZeilen); // překreslit filtr druhů, součty, seznam
}

// ------------------------------------------------------------------
// Mapa rozvozu ovoce: načte excelový seznam (Obst.xlsx) a ukáže
// zastávky na mapě. Podporuje dva formáty:
//  A) Obst.xlsx: Doručeno | Jméno | kg | €/kg | € | Adresa | Poznámka
//     (řádek s nadpisem = druh ovoce, např. "Weichsel", bloků může být víc)
//  B) Šablona:   Datum | Kunde | Adresse | PLZ | Ort | Obst | Menge | Notiz
// ------------------------------------------------------------------

function farbeFuer(obst) {
  const s = String(obst || "").toLowerCase();
  if (/^(weichsel|kirsch|višn|visn|třešn|tresn)/.test(s)) return "#8e1b3a";
  if (/^(zwetschk|pflaume|švestk|svestk)/.test(s)) return "#5b3d8f";
  if (/^(birne|hrušk|hrusk)/.test(s)) return "#7a9a01";
  if (/^(apfel|äpfel|jablk)/.test(s)) return "#cc2b2b";
  if (/^(marille|aprikose|meruňk|merunk)/.test(s)) return "#e8930c";
  if (/^(erdbeer|jahod)/.test(s)) return "#d81b60";
  if (/^(nuss|walnuss|ořech|orech)/.test(s)) return "#6d4c41";
  return "#b8860b";
}
const FARBE_GEMISCHT = "#555555";
const OBST_MUSTER = /^(weichsel|zwetschk|birne|apfel|äpfel|kirsch|marille|aprikose|pflaume|erdbeer|himbeer|nuss|walnuss|obst|višn|visn|třešn|tresn|švestk|svestk|hrušk|hrusk|jablk|meruňk|merunk|jahod|malin|ořech|orech|ovoce)/i;

let karte, markerGruppe, routeGruppe;
let alleZeilen = [];
let obstAuswahl = new Set();
let zeitModus = "alle";
let statusModus = "offen";
// Plánovač: klíče (geoKey) zaškrtnutých zastávek v pořadí rozvozu, přežije obnovení stránky
let planAuswahl = JSON.parse(localStorage.getItem("planAuswahl") || "[]");
let planZurueck = localStorage.getItem("planZurueck") !== "0"; // návrat do Krtel: výchozí zapnuto
let planAbfahrt = localStorage.getItem("planAbfahrt") || "07:00"; // odjezd z Krtel pro výpočet příjezdů
const ENTLADE_MIN = 15; // odhad vykládky na zastávce (pro časy příjezdů)
let letzteOrte = new Map();
let suchText = ""; // filtr seznamu zastávek (jen seznam, mapa a součty zůstávají)

// telefonní čísla v poznámce jako odkazy tel:
function notizHtml(t) {
  return esc(t).replace(/(\+?\d[\d\s\/-]{6,}\d)/g, m => `<a class="tel" href="tel:${m.replace(/[\s\/-]/g, "")}">${m}</a>`);
}
function navUrl(pos) { return `https://waze.com/ul?ll=${pos.lat},${pos.lon}&navigate=yes`; } // Waze: na mobilu otevře rovnou navigaci
function fmtUhr(min) {
  const m = Math.round(min) % (24 * 60);
  return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
}
function planSpeichern() { localStorage.setItem("planAuswahl", JSON.stringify(planAuswahl)); }
// Přetažení karty za úchyt ⠿ mění pořadí zastávek (myš i dotyk)
function planZiehen(ev, row) {
  ev.preventDefault();
  ev.stopPropagation();
  const liste = document.getElementById("stopps");
  const sidebar = document.getElementById("sidebar");
  row.classList.add("dragging");
  // posluchače na document: přesun karty v DOM by zrušil pointer capture na úchytu
  const move = (e) => {
    const rows = [...liste.querySelectorAll(".stopp.im-plan")].filter(r => r !== row);
    let vor = null;
    for (const r of rows) {
      const rect = r.getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) { vor = r; break; }
    }
    if (vor) liste.insertBefore(row, vor);
    else if (rows.length) rows[rows.length - 1].after(row);
    // automatické rolování u okrajů panelu
    const sr = sidebar.getBoundingClientRect();
    if (e.clientY < sr.top + 50) sidebar.scrollTop -= 8;
    else if (e.clientY > sr.bottom - 50) sidebar.scrollTop += 8;
  };
  const up = () => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    document.removeEventListener("pointercancel", up);
    row.classList.remove("dragging");
    // nové pořadí zastávek -> přeskládat klíče druhů po skupinách
    const stops = [...liste.querySelectorAll(".stopp.im-plan")].map(r => r.dataset.key);
    const zbytek = planAuswahl.filter(k => !stops.includes(k.split("§")[0]));
    planAuswahl = stops.flatMap(s => planAuswahl.filter(k => k.split("§")[0] === s)).concat(zbytek);
    planSpeichern();
    routeSig = "";
    aktualisiereAnsicht(false);
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
  document.addEventListener("pointercancel", up);
}
let geocodeLaeuft = false;

// ---------- Mapa ----------
function initKarte() {
  karte = L.map("map").setView([47.7, 14.5], 7); // Rakousko
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(karte);
  routeGruppe = L.layerGroup().addTo(karte);
  markerGruppe = L.layerGroup().addTo(karte);

// ---------- Načtení Excelu ----------
function normKopf(s) { return String(s || "").toLowerCase().replace(/[^a-zäöü]/g, ""); }
function putz(s) {
  return String(s ?? "").replace(/ /g, " ").replace(/\s+/g, " ").replace(/^[,\s]+|[,\s.]+$/g, "").trim();
}

// GPS souřadnice v adrese nebo poznámce (např. "47.7264661, 13.4350206" z Google Maps)
// mají přednost před vyhledáváním adresy. Z textu se po načtení odstraní.
function extrahujKoord(z) {
  const re = /(-?\d{1,3}\.\d{3,})\s*[,;]\s*(-?\d{1,3}\.\d{3,})/;
  for (const feld of ["adresse", "notiz"]) {
    const m = String(z[feld] || "").match(re);
    if (!m) continue;
    const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
    if (Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
      z.koord = { lat, lon };
      z[feld] = putz(String(z[feld]).replace(m[0], " ").replace(/\(\s*\)/, " ")).replace(/^[\s,;–—-]+/, "");
      return;
    }
  }
}

function parseWorkbook(buf) {
  const wb = XLSX.read(buf, { type: "array", cellDates: true });
  const zeilen = [];
  for (const name of wb.SheetNames) {
    const ws = wb.Sheets[name];
    const arr = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
    if (!arr.length) continue;
    const kopf = (arr[0] || []).map(normKopf);
    if (kopf.includes("kunde") && (kopf.includes("ort") || kopf.includes("adresse")))
      parseVorlage(arr, kopf, zeilen);
    else
      parseObstListe(arr, name, wb.SheetNames.length > 1 ? name : "", zeilen);
  }
  return zeilen;
}

// Formát B: šablona s pojmenovanými sloupci
function parseVorlage(arr, kopf, zeilen) {
  const idx = {};
  kopf.forEach((k, i) => {
    if (k.startsWith("datum")) idx.datum = i;
    else if (k.startsWith("kunde") || k.startsWith("name")) idx.kunde = i;
    else if (k.startsWith("adresse") || k.startsWith("strae") || k.startsWith("strasse")) idx.adresse = i;
    else if (k === "plz") idx.plz = i;
    else if (k.startsWith("ort")) idx.ort = i;
    else if (k.startsWith("obst") || k.startsWith("sorte") || k.startsWith("produkt")) idx.obst = i;
    else if (k.startsWith("menge")) idx.menge = i;
    else if (k.startsWith("notiz") || k.startsWith("bemerkung")) idx.notiz = i;
    else if (k.startsWith("geliefert") || k.startsWith("erledigt")) idx.geliefert = i;
  });
  for (let r = 1; r < arr.length; r++) {
    const row = arr[r];
    const z = {
      datum: idx.datum != null ? parseDatum(row[idx.datum]) : null,
      kunde: putz(row[idx.kunde]),
      adresse: putz(row[idx.adresse]),
      plz: putz(row[idx.plz]),
      ort: putz(row[idx.ort]),
      obst: putz(row[idx.obst]) || "Ovoce",
      menge: parseMenge(row[idx.menge]),
      notiz: putz(row[idx.notiz]),
      preis: null, summe: null,
      geliefert: idx.geliefert != null ? istWahr(row[idx.geliefert]) : undefined,
    };
    if (!z.kunde && !z.ort && !z.adresse) continue;
    extrahujKoord(z);
    zeilen.push(z);
  }
}

// Formát A: Obst.xlsx (Doručeno | Jméno | kg | €/kg | € | Adresa | Poznámka)
function parseObstListe(arr, blattName, obstStart, zeilen) {
  let obst = OBST_MUSTER.test(blattName) ? blattName : (obstStart || "");
  for (let r = 0; r < arr.length; r++) {
    const row = arr[r];
    const name = putz(row[1]);
    const adresse = putz(row[5]);
    const mengeRoh = row[2];
    const hatMenge = mengeRoh !== "" && mengeRoh != null && String(mengeRoh).trim() !== "";
    // Řádek s nadpisem: druh ovoce ve sloupci B, bez množství a adresy
    if (name && !adresse && !hatMenge && (r === 0 || OBST_MUSTER.test(name))) { obst = name; continue; }
    if (!name && !adresse) continue; // prázdný nebo součtový řádek
    const z = {
      datum: null,
      kunde: name, adresse, plz: "", ort: "",
      obst: obst || "Ovoce",
      menge: parseMenge(mengeRoh),
      preis: parseMenge(row[3]) || null,
      summe: parseMenge(row[4]) || null,
      notiz: putz(row[6]),
      geliefert: istWahr(row[0]),
    };
    extrahujKoord(z);
    zeilen.push(z);
  }
}

function istWahr(v) {
  if (v === true) return true;
  return /^(ja|ano|x|wahr|true|1|erledigt|hotovo)$/i.test(String(v ?? "").trim());
}

function parseDatum(v) {
  if (v instanceof Date && !isNaN(v)) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if (typeof v === "number") {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }
  const m = String(v).trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
  if (m) {
    let jahr = +m[3]; if (jahr < 100) jahr += 2000;
    return new Date(jahr, +m[2] - 1, +m[1]);
  }
  if (!String(v).trim()) return null;
  const d2 = new Date(v);
  return isNaN(d2) ? null : new Date(d2.getFullYear(), d2.getMonth(), d2.getDate());
}

function parseMenge(v) {
  if (typeof v === "number") return v;
  const s = String(v ?? "").trim();
  if (!s) return 0;
  const n = parseFloat(s.replace(/\./g, "").replace(",", "."));
  return isNaN(n) ? 0 : n;
}

// ---------- Načtení Obst.xlsx přímo z webu (GitHub Pages) ----------
let webLetzte = "";
async function webLaden(erzwingen) {
  try {
    const r = await fetch("Obst.xlsx", { cache: "no-cache" });
    if (!r.ok) return;
    const lm = r.headers.get("Last-Modified") || "";
    if (!erzwingen && lm && lm === webLetzte) return;
    const buf = new Uint8Array(await r.arrayBuffer());
    const zeilen = parseWorkbook(buf);
    webLetzte = lm;
    datenUebernehmen(zeilen);
    const d = lm ? new Date(lm).toLocaleString(LOC(), { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
    setStatus("webGeladen", d);
  } catch (e) { /* offline nebo otevřeno lokálně (file://) – nevadí */ }
}

// ---------- Geokódování (Nominatim / OpenStreetMap) ----------
const geoCache = JSON.parse(localStorage.getItem("geoCache") || "{}");

function geoKey(z) { return [z.adresse, z.plz, z.ort].join("|").toLowerCase(); }

// Několik pokusů na adresu, protože zápisy jsou volné
function sucheVarianten(z) {
  const basis = putz([z.adresse, [z.plz, z.ort].filter(Boolean).join(" ")].filter(Boolean).join(", "))
    .replace(/selbstabholung[,:]?\s*/i, "");
  const v = [];
  if (!basis) return v;
  v.push({ q: basis + ", Österreich", cc: "" });
  v.push({ q: basis, cc: "at,cz,de,sk,hu,si" });
  // jen části s číslicemi (ulice + PSČ), kdyby vadily dodatky typu název hotelu
  const seg = basis.split(",").map(s => s.trim()).filter(Boolean);
  if (seg.length > 2) {
    const mitZiffer = seg.filter(s => /\d/.test(s)).join(", ");
    if (mitZiffer && mitZiffer !== basis) v.push({ q: mitZiffer + ", Österreich", cc: "" });
  }
  // poslední záchrana: jen PSČ
  const plz = basis.match(/\b\d{4}\b/);
  if (plz) v.push({ q: plz[0] + " Österreich", cc: "at" });
  return v;
}

async function geokodieren(zeilen) {
  // řádky s vlastními GPS souřadnicemi: vždy přepsat cache (opravují špatné hledání)
  let koordNove = false;
  for (const z of zeilen) {
    if (!z.koord) continue;
    const k = geoKey(z);
    const stara = geoCache[k];
    if (!stara || stara.lat !== z.koord.lat || stara.lon !== z.koord.lon) {
      geoCache[k] = { lat: z.koord.lat, lon: z.koord.lon };
      koordNove = true;
    }
  }
  if (koordNove) {
    localStorage.setItem("geoCache", JSON.stringify(geoCache));
    aktualisiereAnsicht(true);
  }

  const offen = [];
  const gesehen = new Set();
  for (const z of zeilen) {
    const k = geoKey(z);
    if (!(k in geoCache) && !gesehen.has(k) && (z.adresse || z.ort || z.plz)) { offen.push(z); gesehen.add(k); }
  }
  if (!offen.length) return;
  geocodeLaeuft = true;
  const hinweis = document.getElementById("ladehinweis");
  hinweis.style.display = "block";
  for (let i = 0; i < offen.length; i++) {
    const z = offen[i];
    hinweis.textContent = t("ladenN", i + 1, offen.length);
    let treffer = null;
    for (const v of sucheVarianten(z)) {
      treffer = await nominatim(v.q, v.cc);
      if (treffer) break;
      await new Promise(r => setTimeout(r, 1100)); // Nominatim: max. 1 dotaz/s
    }
    geoCache[geoKey(z)] = treffer; // i „nenalezeno" si pamatujeme
    localStorage.setItem("geoCache", JSON.stringify(geoCache));
    aktualisiereAnsicht();
    if (i < offen.length - 1) await new Promise(r => setTimeout(r, 1100));
  }
  hinweis.style.display = "none";
  geocodeLaeuft = false;
  aktualisiereAnsicht(true);
}

async function nominatim(anfrage, cc) {
  try {
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1"
      + (cc ? "&countrycodes=" + cc : "") + "&q=" + encodeURIComponent(anfrage);
    const r = await fetch(url, { headers: { "Accept-Language": "de" } });
    if (!r.ok) return null;
    const j = await r.json();
    if (!j.length) return null;
    return { lat: +j[0].lat, lon: +j[0].lon };
  } catch (e) { return null; }
}

// ---------- Trasa plánovače (OSRM) ----------
const START_ADRESSE = "Krtely 70, Malovice, Česko"; // odjezd s ovocem
// průjezdní bod Wullowitz: vynutí koridor přes Freistadt (S10) místo Bad Leonfelden
const VIA_FREISTADT = { lat: 48.611, lon: 14.463 };
const PAUSE_SEK = 4.5 * 3600; // povinná přestávka po 4:30 čisté jízdy
let planFreistadt = localStorage.getItem("planFreistadt") !== "0";
// Krtely 70: souřadnice napevno (Nominatim jen jako upřesnění), aby trasa nezávisela na geokódování
let startPos = JSON.parse(localStorage.getItem("startPos") || "null") || { lat: 49.0825996, lon: 14.1701045 };
let routeTimer = null, routeSig = "", letzteRoute = null;

function fmtKm(m) { return (m / 1000).toLocaleString(LOC(), { maximumFractionDigits: 0 }) + " km"; }
function fmtDauer(s) {
  const min = Math.round(s / 60);
  return min >= 60 ? Math.floor(min / 60) + " h " + (min % 60) + " min" : min + " min";
}

async function startSuchen() {
  if (startPos) return startPos;
  startPos = await nominatim(START_ADRESSE, "cz");
  if (startPos) localStorage.setItem("startPos", JSON.stringify(startPos));
  return startPos;
}

function routeAktualisieren(ziele) {
  clearTimeout(routeTimer);
  routeTimer = setTimeout(() => routeLaden(ziele), 400);
}

// součet + dojezdy po úsecích vypsat do stránky (řádky mají data-leg=index)
function routeAnzeigen() {
  if (!letzteRoute) return;
  const pausen = letzteRoute.pausenAnzahl ?? Math.floor(letzteRoute.duration / PAUSE_SEK);
  // časy příjezdů: odjezd + jízda + 45 min za každou pauzu + vykládka na předchozích zastávkách
  const [ah, am] = planAbfahrt.split(":").map(Number);
  const abfahrt = isNaN(ah) || isNaN(am) ? null : ah * 60 + am;
  const legs = letzteRoute.stopLegs || letzteRoute.legs;
  let fahrt = 0, ende = null;
  legs.forEach((leg, i) => {
    fahrt += leg.duration;
    let text = t("dojezd", fmtKm(leg.distance), fmtDauer(leg.duration));
    if (abfahrt !== null) {
      const ankunft = abfahrt + fahrt / 60 + Math.floor(fahrt / PAUSE_SEK) * 45 + i * ENTLADE_MIN;
      text += ` · ${i === legs.length - 1 && planZurueck ? t("doma") : t("prijezd")} ~<b>${fmtUhr(ankunft)}</b>`;
      ende = ankunft;
    }
    const el = document.querySelector(`[data-leg="${i}"]`);
    if (el) el.innerHTML = text;
  });
  document.getElementById("routeInfo").innerHTML =
    `${t("trasa")} <b>${fmtKm(letzteRoute.distance)}</b> · <b>${fmtDauer(letzteRoute.duration)}</b>` +
    (pausen ? t("pauza", pausen) : "") +
    (ende !== null ? t("odjezdKonec", planAbfahrt, fmtUhr(ende)) : "") +
    `<span style="color:#999">${t("routeZusatz", planZurueck, planFreistadt, ENTLADE_MIN)}</span>`;
}

async function routeLaden(ziele) {
  const info = document.getElementById("routeInfo");
  if (!ziele.length) { routeGruppe.clearLayers(); info.innerHTML = ""; routeSig = ""; letzteRoute = null; return; }
  if (!(await startSuchen())) { info.textContent = t("startFehler"); return; }
  // ziel=true jsou zastávky (a návrat domů), ziel=false průjezdní body
  const punkte = [{ ...startPos, ziel: false }];
  if (planFreistadt) punkte.push({ ...VIA_FREISTADT, ziel: false });
  for (const z of ziele) punkte.push({ ...z, ziel: true });
  if (planZurueck) {
    if (planFreistadt) punkte.push({ ...VIA_FREISTADT, ziel: false });
    punkte.push({ ...startPos, ziel: true });
  }
  const sig = JSON.stringify(punkte);
  if (sig === routeSig) { routeAnzeigen(); return; }
  info.textContent = t("berechne");
  try {
    const url = "https://router.project-osrm.org/route/v1/driving/" +
      punkte.map(p => p.lon + "," + p.lat).join(";") + "?overview=full&geometries=geojson&annotations=duration";
    const r = await fetch(url);
    const j = await r.json();
    if (j.code !== "Ok" || !j.routes || !j.routes.length) throw new Error(j.code);
    routeSig = sig;
    letzteRoute = j.routes[0];
    // úseky přes průjezdní body sloučit, aby dojezdy odpovídaly zastávkám
    const stopLegs = [];
    let dist = 0, dur = 0;
    letzteRoute.legs.forEach((leg, i) => {
      dist += leg.distance; dur += leg.duration;
      if (punkte[i + 1].ziel) { stopLegs.push({ distance: dist, duration: dur }); dist = 0; dur = 0; }
    });
    letzteRoute.stopLegs = stopLegs;
    routeGruppe.clearLayers();
    L.geoJSON(letzteRoute.geometry, { style: { color: "#2b6cb0", weight: 4, opacity: .75 } }).addTo(routeGruppe);
    L.circleMarker([startPos.lat, startPos.lon], { radius: 7, color: "#2b6cb0", fillColor: "#fff", fillOpacity: 1, weight: 3 })
      .bindPopup(t("startPopup")).addTo(routeGruppe);
    pausenMarkieren();
    routeAnzeigen();
  } catch (e) {
    info.textContent = t("routeFehler");
  }
}

// Kde budu po každých 4:30 čisté jízdy (povinná přestávka řidiče)
function pausenMarkieren() {
  const coords = letzteRoute.geometry.coordinates; // [lon, lat]
  const segDur = letzteRoute.legs.flatMap(l => (l.annotation && l.annotation.duration) || []);
  let zeit = 0, dalsi = PAUSE_SEK, nr = 1;
  for (let j = 0; j < segDur.length && j + 1 < coords.length; j++) {
    zeit += segDur[j];
    while (zeit >= dalsi) {
      const podil = segDur[j] ? 1 - (zeit - dalsi) / segDur[j] : 0;
      const a = coords[j], b = coords[j + 1];
      const lat = a[1] + (b[1] - a[1]) * podil;
      const lon = a[0] + (b[0] - a[0]) * podil;
      const min = nr * 270;
      const icon = L.divIcon({
        className: "marker-label",
        html: `<div class="pause-marke">☕ ${Math.floor(min / 60)}:${String(min % 60).padStart(2, "0")}</div>`,
        iconSize: [0, 0], iconAnchor: [24, 11]
      });
      L.marker([lat, lon], { icon, zIndexOffset: 500 })
        .bindPopup(t("pausePopup", fmtDauer(dalsi)))
        .addTo(routeGruppe);
      nr++; dalsi += PAUSE_SEK;
    }
  }
  letzteRoute.pausenAnzahl = nr - 1;
}

// Nejkratší pořadí zastávek (OSRM „trip", start v Krtelích)
async function planOptimieren() {
  const keys = [];
  for (const k of planAuswahl) {
    const s = k.split("§")[0];
    if (letzteOrte.has(s) && !keys.includes(s)) keys.push(s);
  }
  const info = document.getElementById("routeInfo");
  if (keys.length < 2) return;
  if (!(await startSuchen())) { info.textContent = t("startFehler"); return; }
  info.textContent = t("sucheReihenfolge");
  try {
    const punkte = [startPos, ...keys.map(k => letzteOrte.get(k).pos)];
    const url = "https://router.project-osrm.org/trip/v1/driving/" +
      punkte.map(p => p.lon + "," + p.lat).join(";") +
      "?source=first&roundtrip=" + (planZurueck ? "true" : "false") + "&overview=false";
    const r = await fetch(url);
    const j = await r.json();
    if (j.code !== "Ok" || !j.waypoints) throw new Error(j.code);
    const stops = j.waypoints.slice(1)
      .map((w, i) => ({ poradi: w.waypoint_index, key: keys[i] }))
      .sort((a, b) => a.poradi - b.poradi)
      .map(x => x.key);
    const zbytek = planAuswahl.filter(k => !stops.includes(k.split("§")[0]));
    planAuswahl = stops.flatMap(s => planAuswahl.filter(k => k.split("§")[0] === s)).concat(zbytek);
    planSpeichern();
    routeSig = "";
    aktualisiereAnsicht(false);
  } catch (e) {
    info.textContent = t("reihenfolgeFehler");
  }
}

// ---------- Převzetí dat a zobrazení ----------
function datenUebernehmen(zeilen) {
  alleZeilen = zeilen;

  // filtr stavu jen tehdy, když existuje sloupec Doručeno
  const hatStatus = zeilen.some(z => z.geliefert !== undefined);

  // filtr období jen tehdy, když jsou v datech datumy
  const hatDatum = zeilen.some(z => z.datum);
  document.getElementById("zeitBlock").style.display = hatDatum ? "" : "none";

  // filtr druhů ovoce (jen při více druzích)
  const sorten = [...new Set(zeilen.map(z => z.obst))].sort((a, b) => a.localeCompare(b, "cs"));
  document.getElementById("obstBlock").style.display = sorten.length > 1 ? "" : "none";
  const div = document.getElementById("obstFilter");
  div.innerHTML = "";
  for (const s of sorten) {
    const lab = document.createElement("label");
    lab.className = "obst";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.value = s;
    cb.checked = !obstAuswahl.size || obstAuswahl.has(s);
    cb.onchange = () => {
      obstAuswahl = new Set([...div.querySelectorAll("input:checked")].map(c => c.value));
      aktualisiereAnsicht(true);
    };
    lab.appendChild(cb);
    const p = document.createElement("span"); p.className = "punkt"; p.style.background = farbeFuer(s);
    lab.appendChild(p);
    lab.appendChild(document.createTextNode(" " + obstName(s)));
    div.appendChild(lab);
  }
  obstAuswahl = new Set(sorten.filter(s => !obstAuswahl.size || obstAuswahl.has(s)));
  if (!obstAuswahl.size) obstAuswahl = new Set(sorten);
  aktualisiereAnsicht(true);
  geokodieren(zeilen);
}

function imZeitraum(z) {
  const von = document.getElementById("von").value ? new Date(document.getElementById("von").value) : null;
  const bis = document.getElementById("bis").value ? new Date(document.getElementById("bis").value) : null;
  if (!z.datum) return zeitModus === "alle" && !von && !bis;
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  if (von || bis) {
    if (von && z.datum < von) return false;
    if (bis && z.datum > bis) return false;
    return true;
  }
  if (zeitModus === "heute") return z.datum.getTime() === heute.getTime();
  if (zeitModus === "7tage") {
    const ende = new Date(heute); ende.setDate(ende.getDate() + 7);
    return z.datum >= heute && z.datum <= ende;
  }
  return true;
}

function imStatus(z) {
  if (z.geliefert === undefined || statusModus === "alle") return true;
  return statusModus === "geliefert" ? z.geliefert : !z.geliefert;
}

function gefiltert() {
  const zeitAktiv = document.getElementById("zeitBlock").style.display !== "none";
  return alleZeilen.filter(z => (!zeitAktiv || imZeitraum(z)) && imStatus(z) && obstAuswahl.has(z.obst));
}

function fmtDatum(d) {
  return d ? d.toLocaleDateString(LOC(), { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" }) : "";
}
function fmtKg(n) { return n.toLocaleString(LOC()) + " kg"; }
function fmtEur(n) { return n.toLocaleString(LOC(), { maximumFractionDigits: 0 }) + " €"; }
function zastavky(n) { return t("stopps", n); }
function markerText(kg) {
  if (!kg) return "?";
  return kg >= 1000 ? (kg / 1000).toLocaleString(LOC(), { maximumFractionDigits: 1 }) + " t" : kg + " kg";
}

function aktualisiereAnsicht(zoomen) {
  const zeilen = gefiltert();

  // --- seskupení podle adresy ---
  const orte = new Map();
  const ohneKoord = [];
  for (const z of zeilen) {
    const k = geoKey(z);
    const pos = geoCache[k];
    if (!pos) { if (k in geoCache) ohneKoord.push(z); continue; }
    if (!orte.has(k)) orte.set(k, { pos, key: k, zeilen: [] });
    orte.get(k).zeilen.push(z);
  }

  // Plánovač: výběr po druzích ovoce, klíč = geoKey + "§" + druh.
  // Na mapě a v součtech jsou jen zaškrtnuté druhy, zastávky v pořadí rozvozu.
  const planModus = statusModus === "plan";
  const imPlanZeile = z => planAuswahl.includes(geoKey(z) + "§" + z.obst);
  const planKeys = [];
  if (planModus) {
    for (const k of planAuswahl) {
      const s = k.split("§")[0];
      if (orte.has(s) && !planKeys.includes(s) && orte.get(s).zeilen.some(imPlanZeile)) planKeys.push(s);
    }
  }
  const anzeigen = planModus
    ? new Map(planKeys.map(k => {
        const o = orte.get(k);
        return [k, { ...o, zeilen: o.zeilen.filter(imPlanZeile) }];
      }))
    : orte;
  letzteOrte = orte;
  document.getElementById("summenTitel").textContent = planModus ? t("summenPlan") : t("summenAuswahl");

  // --- markery ---
  markerGruppe.clearLayers();
  const punkte = [];
  let planNr = 0;
  for (const [key, { pos, zeilen: zl }] of anzeigen) {
    planNr++;
    const gesamt = zl.reduce((s, z) => s + z.menge, 0);
    const erledigt = zl.every(z => z.geliefert === true);
    // množství po druzích ovoce (pořadí = pořadí v tabulce)
    const proObst = new Map();
    for (const z of zl) proObst.set(z.obst, (proObst.get(z.obst) || 0) + z.menge);
    const mehrsortig = !erledigt && proObst.size > 1 && gesamt > 0;
    let hintergrund, inhalt;
    if (mehrsortig) {
      // koláč: barevné výseče podle podílu kg, uvnitř množství po druzích
      let acc = 0;
      const teile = [];
      for (const [obst, kg] of proObst) {
        const von = (acc / gesamt) * 100;
        acc += kg;
        teile.push(`${farbeFuer(obst)} ${von.toFixed(2)}% ${(acc / gesamt * 100).toFixed(2)}%`);
      }
      hintergrund = `conic-gradient(${teile.join(", ")})`;
      inhalt = `<div class="marker-sorten">` +
        [...proObst.values()].map(kg => `<div>${markerText(kg)}</div>`).join("") + `</div>`;
    } else {
      const sorten = [...proObst.keys()];
      hintergrund = erledigt ? "#2e7d32" : (sorten.length === 1 ? farbeFuer(sorten[0]) : FARBE_GEMISCHT);
      inhalt = markerText(gesamt);
    }
    const groesse = Math.max(mehrsortig ? 44 : 34, Math.min(64, 26 + Math.sqrt(gesamt) * 1.1));
    const icon = L.divIcon({
      className: "marker-label",
      html: `<div class="marker-kreis${erledigt ? " erledigt" : ""}" style="width:${groesse}px;height:${groesse}px;background:${hintergrund}">${erledigt ? "✓ " : ""}${inhalt}${planModus ? `<span class="marker-nr">${planNr}</span>` : ""}</div>`,
      iconSize: [groesse, groesse], iconAnchor: [groesse / 2, groesse / 2]
    });
    const m = L.marker([pos.lat, pos.lon], { icon }).addTo(markerGruppe);
    m.bindPopup(popupHtml(zl, gesamt, pos), { maxWidth: 340 });
    orte.get(key).marker = m; // kliknutí v seznamu otevře bublinu
    punkte.push([pos.lat, pos.lon]);
  }
  if (zoomen && punkte.length) karte.fitBounds(punkte, { padding: [50, 50], maxZoom: 12, animate: false });

  // --- trasa plánovače ---
  if (planModus) routeAktualisieren(planKeys.map(k => orte.get(k).pos));
  else if (routeGruppe) { routeGruppe.clearLayers(); document.getElementById("routeInfo").innerHTML = ""; routeSig = ""; letzteRoute = null; }

  // --- součty ---
  const summen = {};
  const zeilenSumme = planModus ? [...anzeigen.values()].flatMap(o => o.zeilen) : zeilen;
  for (const z of zeilenSumme) {
    if (!summen[z.obst]) summen[z.obst] = { kg: 0, eur: 0 };
    summen[z.obst].kg += z.menge;
    summen[z.obst].eur += z.summe || 0;
  }
  const tabelle = document.getElementById("summen");
  tabelle.innerHTML = "";
  let gKg = 0, gEur = 0;
  const hatEur = zeilenSumme.some(z => z.summe);
  for (const [obst, s] of Object.entries(summen).sort()) {
    gKg += s.kg; gEur += s.eur;
    tabelle.insertAdjacentHTML("beforeend",
      `<tr><td><span class="punkt" style="background:${farbeFuer(obst)};margin-right:6px;vertical-align:-1px"></span>${esc(obstName(obst))}</td><td class="z">${fmtKg(s.kg)}</td>${hatEur ? `<td class="z">${fmtEur(s.eur)}</td>` : ""}</tr>`);
  }
  tabelle.insertAdjacentHTML("beforeend",
    `<tr style="border-top:1px solid #b9c5a5"><td><b>${t("celkem")} · ${zastavky(anzeigen.size)}</b></td><td class="z">${fmtKg(gKg)}</td>${hatEur ? `<td class="z">${fmtEur(gEur)}</td>` : ""}</tr>`);
  if (hatEur && kurzCZK && gEur) {
    tabelle.insertAdjacentHTML("beforeend",
      `<tr><td colspan="3" style="text-align:right;color:#555;font-size:12.5px;padding-top:2px">≈ <b>${Math.round(gEur * kurzCZK).toLocaleString(LOC())} Kč</b> <span style="color:#999">(${kurzCZK.toLocaleString(LOC(), { maximumFractionDigits: 3 })} Kč/€ · ${kurzZdroj})</span></td></tr>`);
  }

  // --- seznam zastávek ---
  const liste = document.getElementById("stopps");
  liste.innerHTML = orte.size ? "" : (alleZeilen.length ? t("nichts") : "–");
  if (planModus && orte.size) {
    const info = document.createElement("div");
    info.style.cssText = "font-size:12.5px;color:#555;margin-bottom:6px;line-height:1.7";
    if (anzeigen.size) {
      info.innerHTML = `${t("naplanovano")} <b>${zastavky(anzeigen.size)}</b> · <a href="#" id="planLeeren" style="color:var(--gruen)">${t("zrusit")}</a>` +
        (anzeigen.size >= 2 ? ` · <a href="#" id="planSortieren" style="color:var(--gruen)">${t("nejkratsi")}</a>` : "") +
        `<br><label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12.5px"><input type="checkbox" id="planRueck"${planZurueck ? " checked" : ""}> ${t("navrat")}</label>` +
        `<label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12.5px"><input type="checkbox" id="planFrei"${planFreistadt ? " checked" : ""}> ${t("freistadt")}</label>` +
        `<label style="display:flex;align-items:center;gap:6px;font-size:12.5px">${t("odjezd")} <input type="time" id="planAbfahrt" value="${esc(planAbfahrt)}" style="font-size:13px;padding:2px 4px;border:1px solid #b9c5a5;border-radius:4px"></label>`;
    } else {
      info.textContent = t("planHinweis");
    }
    const ab = info.querySelector("#planAbfahrt");
    if (ab) ab.onchange = () => {
      planAbfahrt = ab.value || "07:00";
      localStorage.setItem("planAbfahrt", planAbfahrt);
      aktualisiereAnsicht(false);
    };
    liste.appendChild(info);
    const a = info.querySelector("#planLeeren");
    if (a) a.onclick = (ev) => {
      ev.preventDefault();
      planAuswahl = [];
      planSpeichern();
      aktualisiereAnsicht(false);
    };
    const so = info.querySelector("#planSortieren");
    if (so) so.onclick = (ev) => { ev.preventDefault(); planOptimieren(); };
    const rb = info.querySelector("#planRueck");
    if (rb) rb.onchange = () => {
      planZurueck = rb.checked;
      localStorage.setItem("planZurueck", planZurueck ? "1" : "0");
      routeSig = "";
      aktualisiereAnsicht(false);
    };
    const fr = info.querySelector("#planFrei");
    if (fr) fr.onchange = () => {
      planFreistadt = fr.checked;
      localStorage.setItem("planFreistadt", planFreistadt ? "1" : "0");
      routeSig = "";
      aktualisiereAnsicht(false);
    };
  }
  const sortiert = [...orte.values()].sort((a, b) => {
    const da = a.zeilen[0].datum ? a.zeilen[0].datum.getTime() : 9e15;
    const db = b.zeilen[0].datum ? b.zeilen[0].datum.getTime() : 9e15;
    return da - db || b.zeilen.reduce((s, z) => s + z.menge, 0) - a.zeilen.reduce((s, z) => s + z.menge, 0);
  });
  if (planModus) { // zaškrtnuté nahoru, v pořadí rozvozu
    const rang = new Map(planKeys.map((k, i) => [k, i]));
    sortiert.sort((a, b) => (rang.has(a.key) ? rang.get(a.key) : 9e9) - (rang.has(b.key) ? rang.get(b.key) : 9e9));
  }
  let versteckt = 0;
  for (const o of sortiert) {
    const z0 = o.zeilen[0];
    const kg = o.zeilen.reduce((s, z) => s + z.menge, 0);
    const eur = o.zeilen.reduce((s, z) => s + (z.summe || 0), 0);
    const erledigt = o.zeilen.every(z => z.geliefert === true);
    const adr = [z0.adresse, (z0.plz + " " + z0.ort).trim()].filter(Boolean).join(", ");
    const notizen = [...new Set(o.zeilen.map(z => z.notiz).filter(Boolean))];
    if (suchText) { // hledání filtruje jen seznam
      const text = [adr, ...o.zeilen.map(z => z.kunde), ...o.zeilen.map(z => z.obst), ...notizen].join(" ").toLowerCase();
      if (!text.includes(suchText)) { versteckt++; continue; }
    }
    const d = document.createElement("div");
    const imPlan = planKeys.includes(o.key);
    d.className = "stopp" + (erledigt ? " erledigt" : "") + (planModus ? " mit-cb" + (imPlan ? " im-plan" : "") : "");
    const inhalt = `<b>${erledigt ? '<span class="haken">✓</span> ' : ""}${esc([...new Set(o.zeilen.map(z => z.kunde).filter(Boolean))].join(" / ") || adr)}</b>` +
      `<span class="grau">${esc(adr)}</span>` +
      `<span class="grau"> · ${kg ? fmtKg(kg) : t("mengeUnbekannt")}${eur ? " · " + fmtEur(eur) : ""}</span>` +
      ` <a class="nav" href="${navUrl(o.pos)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t("waze")}</a>` +
      notizen.map(n => `<span class="notiz${/urlaub|dovolen|nicht|!/i.test(n) ? " warn" : ""}">📝 ${notizHtml(n)}</span>`).join("");
    if (planModus) {
      const w = document.createElement("div");
      w.className = "stopp-inhalt";
      w.innerHTML = inhalt + (imPlan ? `<span class="grau" style="display:block" data-leg="${planKeys.indexOf(o.key)}"></span>` : "");
      // rozpis druhů ovoce se zaškrtávátky (výběr po druzích)
      const proObst = new Map();
      for (const z of o.zeilen) {
        const e = proObst.get(z.obst) || { kg: 0, eur: 0 };
        e.kg += z.menge; e.eur += z.summe || 0;
        proObst.set(z.obst, e);
      }
      const dl = document.createElement("div");
      dl.className = "plan-obst";
      for (const [obst, s] of proObst) {
        const klic = o.key + "§" + obst;
        const lab = document.createElement("label");
        lab.onclick = (ev) => ev.stopPropagation();
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = planAuswahl.includes(klic);
        cb.onchange = () => {
          if (cb.checked) planAuswahl.push(klic);
          else planAuswahl = planAuswahl.filter(k => k !== klic);
          planSpeichern();
          routeSig = "";
          aktualisiereAnsicht(false);
        };
        lab.appendChild(cb);
        const p = document.createElement("span");
        p.className = "punkt";
        p.style.background = farbeFuer(obst);
        lab.appendChild(p);
        lab.appendChild(document.createTextNode(` ${obstName(obst)} · ${fmtKg(s.kg)}${s.eur ? " · " + fmtEur(s.eur) : ""}`));
        dl.appendChild(lab);
      }
      w.appendChild(dl);
      d.appendChild(w);
      if (imPlan) {
        d.dataset.key = o.key;
        const ctr = document.createElement("div");
        ctr.className = "plan-ctrl";
        const nr = document.createElement("span");
        nr.className = "plan-nr";
        nr.textContent = planKeys.indexOf(o.key) + 1;
        ctr.appendChild(nr);
        const griff = document.createElement("span");
        griff.className = "plan-griff";
        griff.textContent = "⠿";
        griff.title = t("griffTitel");
        griff.onpointerdown = (ev) => planZiehen(ev, d);
        griff.onclick = (ev) => ev.stopPropagation();
        ctr.appendChild(griff);
        d.appendChild(ctr);
      }
    } else {
      d.innerHTML = inhalt;
    }
    d.onclick = () => {
      karte.setView([o.pos.lat, o.pos.lon], 13);
      if (o.marker) o.marker.openPopup();
    };
    liste.appendChild(d);
  }
  if (versteckt) {
    const v = document.createElement("div");
    v.className = "grau";
    v.style.cssText = "font-size:12px;padding:4px 8px";
    v.textContent = t("versteckt", versteckt);
    liste.appendChild(v);
  }

  // návrat domů jako poslední položka plánu
  if (planModus && planZurueck && anzeigen.size) {
    const heim = document.createElement("div");
    heim.className = "stopp";
    heim.innerHTML = `<b>${t("heim")}</b><span class="grau" data-leg="${planKeys.length}"></span>`;
    heim.onclick = () => { if (startPos) karte.setView([startPos.lat, startPos.lon], 12); };
    const zaskrtnute = liste.querySelectorAll(".im-plan");
    if (zaskrtnute.length) zaskrtnute[zaskrtnute.length - 1].after(heim);
    else liste.appendChild(heim);
  }

  // --- nenalezené adresy ---
  const fb = document.getElementById("fehlerBlock");
  const uniq = [...new Map(ohneKoord.map(z => [geoKey(z), z])).values()];
  if (uniq.length && !geocodeLaeuft) {
    fb.style.display = "";
    document.getElementById("fehler").innerHTML = uniq.map(z =>
      t("fehlerZeile", esc(z.kunde), esc([z.adresse, z.plz, z.ort].filter(Boolean).join(", ")))).join("<br>");
  } else fb.style.display = "none";
}

function popupHtml(zl, gesamt, pos) {
  const z0 = zl[0];
  const adr = [z0.adresse, (z0.plz + " " + z0.ort).trim()].filter(Boolean).join(", ");
  const einKunde = new Set(zl.map(z => z.kunde)).size === 1;
  const sortiert = [...zl].sort((a, b) => (a.datum?.getTime() || 0) - (b.datum?.getTime() || 0));
  const gesEur = zl.reduce((s, z) => s + (z.summe || 0), 0);
  let html = `<div class="popup-lief"><h3>${esc(einKunde ? (z0.kunde || adr) : adr)}</h3>`;
  html += `<div style="color:#555;margin-bottom:6px">${esc(adr)}</div><table>`;
  for (const z of sortiert) {
    const statusZelle = z.geliefert === undefined ? "" :
      (z.geliefert ? '<span class="haken">✓</span>' : '<span class="offen-punkt">●</span>');
    html += `<tr>`;
    if (statusZelle) html += `<td>${statusZelle}</td>`;
    if (!einKunde) html += `<td>${esc(z.kunde)}</td>`;
    if (z.datum) html += `<td>${esc(fmtDatum(z.datum))}</td>`;
    html += `<td><span class="punkt" style="background:${farbeFuer(z.obst)};margin-right:4px;vertical-align:-1px"></span>${esc(obstName(z.obst))}</td>`;
    html += `<td style="text-align:right">${z.menge ? fmtKg(z.menge) : "?"}</td>`;
    html += `<td style="text-align:right">${z.summe ? fmtEur(z.summe) : ""}</td></tr>`;
    if (z.notiz) html += `<tr><td colspan="6" style="color:#777;font-style:italic;padding-left:18px">📝 ${notizHtml(z.notiz)}</td></tr>`;
  }
  if (zl.length > 1) html += `<tr class="sum"><td colspan="4">${t("celkem")}</td><td style="text-align:right">${fmtKg(gesamt)}</td><td style="text-align:right">${gesEur ? fmtEur(gesEur) : ""}</td></tr>`;
  html += `</table>`;
  if (pos) html += `<div style="margin-top:8px"><a class="nav" href="${navUrl(pos)}" target="_blank" rel="noopener">${t("popupWaze")}</a></div>`;
  html += `</div>`;
  return html;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function setStatus(k, ...args) {
  letzterStatus = [k, ...args];
  document.getElementById("status").textContent = t(k, ...args);
}

// ---------- Ovládací prvky ----------
document.querySelectorAll("#statusKnoepfe button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#statusKnoepfe button").forEach(x => x.classList.remove("aktiv"));
    b.classList.add("aktiv");
    statusModus = b.dataset.s;
    aktualisiereAnsicht(true);
  };
});
document.querySelectorAll("#zeitKnoepfe button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#zeitKnoepfe button").forEach(x => x.classList.remove("aktiv"));
    b.classList.add("aktiv");
    zeitModus = b.dataset.z;
    document.getElementById("von").value = "";
    document.getElementById("bis").value = "";
    aktualisiereAnsicht(true);
  };
});
document.getElementById("von").onchange = () => aktualisiereAnsicht(true);
document.getElementById("bis").onchange = () => aktualisiereAnsicht(true);
document.getElementById("suche").oninput = (ev) => {
  suchText = ev.target.value.trim().toLowerCase();
  aktualisiereAnsicht(false);
};
// mobil: přepínání mezi seznamem a celoobrazovkovou mapou
document.getElementById("kartenToggle").onclick = (ev) => {
  const nurKarte = document.body.classList.toggle("nur-karte");
  ev.currentTarget.textContent = nurKarte ? t("liste") : t("nurKarte");
  setTimeout(() => karte.invalidateSize(), 50);
};
document.querySelectorAll("#sprachen button").forEach(b => { b.onclick = () => spracheSetzen(b.dataset.l); });
letzterStatus = ["statusLeer"];
statischeTexte();

// testovací/ladicí rozhraní
window.__ladeZeilen = (zeilen) => datenUebernehmen(zeilen.map(z => ({ ...z, datum: z.datum ? new Date(z.datum) : null })));

initKarte();
webLaden(true);
nactiKurz();
</script>
